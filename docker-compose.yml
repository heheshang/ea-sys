services:
  postgres:
    image: postgres:16-alpine
    container_name: ea-sys-postgres
    environment:
      POSTGRES_DB: ea_sys
      POSTGRES_USER: ea_sys
      POSTGRES_PASSWORD: ea_sys
    ports:
      - "5432:5432"
    volumes:
      - ea-sys-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ea_sys -d ea_sys"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ea-sys-redis
    ports:
      - "6379:6379"
    volumes:
      - ea-sys-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ea-sys-pgdata:
  ea-sys-redisdata: