# docker-java 内置 API 版本协商兜底：Docker Engine >= 29（含 colima/lima 引擎）最低
# 接受 API 1.40，而 testcontainers 内嵌 docker-java 默认按 1.32 请求会被 400 拒绝
# （"client version 1.32 is too old. Minimum supported API version is 1.40"）。
# 见 https://github.com/docker-java/docker-java DefaultDockerClientConfig 属性读取顺序。
api.version=1.40