server:
  port: 8080

spring:
  application:
    name: ea-sys
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ea_sys}
    username: ${DB_USER:ea_sys}
    password: ${DB_PASSWORD:ea_sys}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

app:
  jwt:
    secret: ${JWT_SECRET:ea-sys-dev-secret-key-change-me-0123456789abcdef0123456789abcdef}
    expire-hours: 24

easysys:
  frequency:
    daily-cap: 10000
    # 0 = 关闭用户级 24h 频控窗口（本地开发反复触达测试），daily-cap 仍生效；生产须改回 >0。
    user-window-hours: 0
  channel:
    # 通道凭据加密口令：AES（AesBytesEncryptor）派生，生产必须经环境变量 CHANNEL_ENCRYPT_PASSWORD 覆盖。
    encrypt-password: ${CHANNEL_ENCRYPT_PASSWORD:ea-sys-dev-channel-key}
  notify:
    # 回调服务（ea-sys-notify）地址：受理成功后把真正触达任务交给 notify 异步执行。
    base-url: ${NOTIFY_BASE_URL:http://localhost:8092}
    # 回执回调鉴权内部 token：与 ea-sys-notify 的 easysys.notify.callback-token 一致。
    callback-token: ${NOTIFY_CALLBACK_TOKEN:ea-sys-notify-dev-token}
  agent:
    llm:
      # LLM 主提供方（Token Plan 套餐专属 OpenAI 兼容端点）。enabled 缺省 false 时执行器保持确定性 RuleModel。
      # apiKey 经环境变量注入，不落库；key 缺失/失效/超时/结构不符均由执行器降级为确定性 fallback，执行不中断。
      enabled: ${EA_LLM_ENABLED:true}
      model-id: openai:qwen3.7-plus
      base-url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api-key: ${EA_LLM_API_KEY:}
      timeout-ms: 60000